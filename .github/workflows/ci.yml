# Type-check, test and build both apps on every push and pull request.
# The browser tests (e2e/) need the whole stack and are not run here yet.
name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    # A real MongoDB, so the integration test runs instead of skipping.
    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
    env:
      MONGODB_TEST_URI: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      # The build never calls the API (see web/Dockerfile); any address will do.
      API_BASE_URL: http://127.0.0.1:4999
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
